# Helm — Direct K8s Agent Deploy (values override)
#
# Use this in an Octopus "Upgrade a Helm Chart" step targeting the
# creid-aks deployment target (role: k8s-agent).
#
# Step configuration:
#   Chart source:   Git repository (same repo)
#   Chart path:     argocd/environments/helm
#   Release name:   demo-app-helm
#   Namespace:      demo-helm
#   Values:         Paste the content below into "Additional Values YAML"
#                   (this overrides just the tag; the rest comes from values.yaml)
#
# Octopus substitutes #{Image.Tag} before the Helm upgrade runs.
#
# Variables required:
#   Image.Tag  — Image tag to deploy (e.g. v3.0)
#
image:
  tag: "#{Image.Tag}"
