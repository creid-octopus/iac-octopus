# Raw YAML — Direct K8s Agent Deploy
#
# Paste this content into an Octopus "Deploy Kubernetes YAML" step targeting
# the aks-argocd-demo deployment target (role: k8s-agent).
#
# Octopus substitutes #{Image.Tag} before applying. After apply, ArgoCD will
# detect drift (the live state differs from git) — this is intentional: it
# demonstrates the contrast between direct deploy and GitOps promotion.
#
# Variables required:
#   Image.Tag  — Image tag to deploy (e.g. v3.0)
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: demo-raw
  labels:
    app: demo-app
    deploy-version: "#{Image.Tag}"
    managed-by: octopus-direct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: "#{Image.Tag}"
    spec:
      containers:
        - name: demo-app
          image: docker.io/kostiscodefresh/gitops-simple-app:#{Image.Tag}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: demo-raw
  labels:
    app: demo-app
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
