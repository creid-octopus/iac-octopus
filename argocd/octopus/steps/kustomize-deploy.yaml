# Kustomize — Direct K8s Agent Deploy (tenant-aware)
#
# Paste into an Octopus "Deploy Kubernetes YAML" step targeting
# the creid-aks deployment target (role: k8s-agent).
#
# The Namespace resource is included so this step is self-contained.
# Octopus resolves #{...} variables before applying.
#
# Variables required:
#   Project.Kubernetes.Namespace  — set per tenant (e.g. apextime-dev)
#   Image.Tag                     — image tag to deploy (e.g. v3.0)
#
# NOTE: "Deploy Kubernetes YAML" applies inline YAML — it does not run
# kustomize build. Two options:
#
# ── Option A: Run a Script step (preferred for Kustomize direct deploy) ─────────
#
#   repo_path=$(get_octopusvariable "Octopus.Calamari.Git.RepositoryPath")
#   kubectl kustomize "$repo_path/argocd/environments/kustomize/overlays/dev" \
#     | sed "s|newTag:.*|newTag: #{Image.Tag}|" \
#     | kubectl apply -f -
#   kubectl create namespace #{Project.Kubernetes.Namespace} --dry-run=client -o yaml \
#     | kubectl apply -f -
#
# ── Option B: Expanded YAML (below — paste as Deploy Kubernetes YAML) ───────────
#
apiVersion: v1
kind: Namespace
metadata:
  name: #{Project.Kubernetes.Namespace}
  labels:
    managed-by: octopus
    tenant: "#{Octopus.Tenant.Alias}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: #{Project.Kubernetes.Namespace}
  labels:
    app: demo-app
    deploy-version: "#{Image.Tag}"
    managed-by: octopus-direct
    tenant: "#{Octopus.Tenant.Alias}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
        version: "#{Image.Tag}"
        tenant: "#{Octopus.Tenant.Alias}"
    spec:
      containers:
        - name: demo-app
          image: docker.io/kostiscodefresh/gitops-simple-app:#{Image.Tag}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  namespace: #{Project.Kubernetes.Namespace}
  labels:
    app: demo-app
    tenant: "#{Octopus.Tenant.Alias}"
spec:
  selector:
    app: demo-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
