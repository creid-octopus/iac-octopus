# Grafana Helm chart values — demo environment
# Chart: grafana/grafana (https://grafana.github.io/helm-charts)

service:
  type: ClusterIP  # Access via port-forward; change to LoadBalancer for persistent access

# Disable persistence — not needed for demos, keeps teardown clean
persistence:
  enabled: false

# Default admin credentials — change the password for anything beyond a local demo
adminUser: admin
adminPassword: admin

grafana.ini:
  auth.anonymous:
    enabled: false
