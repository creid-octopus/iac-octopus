apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus
  namespace: argocd
spec:
  project: default
  sources:
    # kube-prometheus-stack chart from the prometheus-community registry
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "70.*"
      helm:
        valueFiles:
          - $values/argocd/cluster-infra/kube-prometheus/values.yaml
    # Values file from this repo
    - repoURL: https://github.com/creid-octopus/iac-octopus
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # Required for kube-prometheus-stack CRDs (ServerSideApply avoids annotation size limits)
      - ServerSideApply=true
      - PruneLast=true
