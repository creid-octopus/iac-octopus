apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-kustomize-test
  namespace: argocd
  annotations:
    # Octopus ArgoCD gateway — maps this Application to a project/environment
    argo.octopus.com/project: "gitops-sample-app-kustomize"
    argo.octopus.com/environment: "test"
spec:
  project: default
  source:
    repoURL: https://github.com/creid-octopus/iac-octopus
    targetRevision: HEAD
    path: argocd/environments/kustomize/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: demo-kustomize-test
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
