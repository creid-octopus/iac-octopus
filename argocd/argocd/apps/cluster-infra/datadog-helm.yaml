apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: datadog
  namespace: argocd
spec:
  project: default
  sources:
    # Datadog Helm chart from the official registry
    - repoURL: https://helm.datadoghq.com
      chart: datadog/datadog
      targetRevision: "3.241.0"
      helm:
        valueFiles:
          - $values/argocd/cluster-infra/datadog/values.yaml
    # Values file from this repo
    - repoURL: https://github.com/creid-octopus/iac-octopus
      targetRevision: renovate-config
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      # Required for kube-prometheus-stack CRDs (ServerSideApply avoids annotation size limits)
      - ServerSideApply=true
      - PruneLast=true