apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-kustomize-apextime-dev
resources:
  - ../../../base

images:
  - name: docker.io/kostiscodefresh/gitops-simple-app
    newTag: "v3.0"

commonLabels:
  env: dev
  tenant: apextime
  managed-by: octopus

commonAnnotations:
  octopus.com/tenant: apextime
  octopus.com/environment: development
