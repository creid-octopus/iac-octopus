apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo-kustomize-apextime-dev
resources:
  - ../../../base

images:
  - name: docker.io/kostiscodefresh/gitops-simple-app
    newTag: "v4.0"

commonLabels:
  env: dev
  tenant: apextime
  managed-by: octopus

commonAnnotations:
  octopus.com/tenant: apextime
  octopus.com/environment: development

patches:
  - target:
      kind: Namespace
      name: placeholder
    patch: |-
      - op: replace
        path: /metadata/name
        value: demo-kustomize-apextime-dev
